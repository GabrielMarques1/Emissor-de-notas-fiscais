<!DOCTYPE html>
<html>
<head>
    <title>Teste PDV JavaScript</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1>Teste PDV JavaScript</h1>
    <button onclick="testarFecharCaixa()" style="padding:10px; font-size:16px;">Testar Fechar Caixa</button>
    <button onclick="verificarFuncoes()" style="padding:10px; font-size:16px;">Verificar Funções</button>
    
    <div id="log" style="margin-top:20px; padding:10px; background:#f0f0f0; font-family:monospace; white-space:pre-wrap;"></div>

    <script src="/pdv/js/app.js"></script>
    <script>
        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.textContent += new Date().toLocaleTimeString() + ': ' + msg + '\n';
        }
        
        function verificarFuncoes() {
            log('Verificando se as funções existem...');
            log('window.fecharCaixa: ' + (typeof window.fecharCaixa));
            log('window.fecharCaixaBtn: ' + (typeof window.fecharCaixaBtn));
            log('window.Swal: ' + (typeof window.Swal));
        }
        
        async function testarFecharCaixa() {
            log('Iniciando teste de fechar caixa...');
            if (typeof window.fecharCaixaBtn === 'function') {
                try {
                    await window.fecharCaixaBtn();
                    log('Função executada com sucesso');
                } catch(e) {
                    log('Erro ao executar função: ' + e.message);
                }
            } else {
                log('Função fecharCaixaBtn não encontrada!');
            }
        }
        
        // Auto-verificar quando carregou
        setTimeout(verificarFuncoes, 1000);
    </script>
</body>
</html>
