<!DOCTYPE html>
<html>
<head>
    <title>Teste Paywall</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1>Teste do Pop-up de Paywall</h1>
    <button onclick="testPaywall()">Testar Pop-up</button>

    <script>
        function testPaywall() {
            Swal.fire({
                icon: 'warning',
                title: 'Acesso restrito a assinantes ativos. Conclua o pagamento para continuar.',
                showCancelButton: true,
                confirmButtonText: 'Fazer pagamento',
                cancelButtonText: 'Fechar'
            }).then((result) => {
                if (result.isConfirmed) {
                    console.log('Usuário clicou em Fazer pagamento');
                    
                    // Simular requisição AJAX
                    const payload = {
                        email_empresa: 'teste@exemplo.com',
                        nome_fantasia: 'Teste',
                        contador_email: '',
                        cnpj: '',
                    };
                    
                    console.log('Enviando requisição para:', '/stripe/checkout');
                    console.log('Payload:', payload);
                    
                    fetch('/stripe/checkout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams(payload)
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Resposta checkout recebida:', data);
                        if (data && data.url) {
                            console.log('Redirecionando para:', data.url);
                            window.location.href = data.url;
                        } else {
                            console.error('Resposta inválida:', data);
                            Swal.fire({ 
                                icon: 'error', 
                                title: 'Erro no checkout',
                                text: (data && data.error) ? data.error : 'Falha ao iniciar pagamento'
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Erro AJAX:', error);
                        Swal.fire({ 
                            icon: 'error', 
                            title: 'Erro',
                            text: 'Falha ao iniciar checkout'
                        });
                    });
                }
            });
        }
    </script>
</body>
</html>
