<!DOCTYPE html>
<html>
<head>
    <title>Teste Simples</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1>Teste Simples do Pop-up</h1>
    <button onclick="testAlert()">Testar Alert</button>
    <button onclick="testPaywall()">Testar Paywall</button>

    <script>
        function testAlert() {
            alert('Teste básico funcionando!');
        }

        function testPaywall() {
            Swal.fire({
                icon: 'warning',
                title: 'Acesso restrito a assinantes ativos. Conclua o pagamento para continuar.',
                showCancelButton: true,
                confirmButtonText: 'Fazer pagamento',
                cancelButtonText: 'Fechar'
            }).then((result) => {
                if (result.isConfirmed) {
                    alert('Usuário clicou em Fazer pagamento!');
                    // Simular redirecionamento
                    window.location.href = 'https://stripe.com';
                }
            });
        }
    </script>
</body>
</html>
